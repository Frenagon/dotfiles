# Based on Omarchy's default (/usr/share/omarchy/config/starship.toml), with:
#  - a multiline prompt: the command line sits on its own row, below the info
#  - starship's connective words restored ("on" / "via" / "took") — Omarchy's
#    compact single-line format had stripped them
#  - a Nerd Font glyph on the git branch (Omarchy ships a Nerd Font)
# Colours are left at starship's defaults.

add_newline = true
command_timeout = 200
format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$golang\
$lua\
$cmd_duration
$character"""

[directory]
truncation_length = 2
truncation_symbol = "…/"

[git_branch]
format = "on [$symbol$branch]($style) "
symbol = " "

[git_status]
format     = '([$all_status$ahead_behind]($style) )'
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""
