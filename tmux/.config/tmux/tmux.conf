# ~/.config/tmux/tmux.conf
#
# tmux 3.x reads this XDG path in preference to ~/.tmux.conf. Omarchy ships its
# own config at /usr/share/omarchy/config/tmux/tmux.conf and copies it here on a
# fresh install — this replaces that copy and sources the shipped one instead,
# so Omarchy stays the source of truth for terminal features, the pane/window/
# session keybinding set, and most of the theme. Personal overrides follow.
#
# Plugins are managed by TPM (Omarchy ships no plugin manager). One-time setup:
#   git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm
# then press <prefix> + I inside tmux to install the plugins listed below.
#
# tmux-agent-sidebar also needs a one-time Claude Code step once TPM installs it:
#   /plugin marketplace add ~/.config/tmux/plugins/tmux-agent-sidebar
#   /plugin install tmux-agent-sidebar@hiroppy

source-file /usr/share/omarchy/config/tmux/tmux.conf

######################## Personal overrides ########################

# Prefix: C-a only (Omarchy uses C-Space, with C-b as a second prefix).
set -g prefix C-a
set -g prefix2 None
unbind C-Space
bind C-a send-prefix

set -g clock-mode-style 24
bind s choose-tree -sZ -O name

## ── Status bar ───────────────────────────────────────────────────────────
# Styled from the terminal's indexed palette (colour0-15) and the default
# fg/bg so it follows whatever theme the terminal is using. Omarchy puts the
# bar on top with prefix/zoom/copy indicators at the right; this moves it back
# to the bottom and shows the running command + session name instead.
set -g status-position bottom
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100

set -g status-style "bg=default,fg=colour7"
set -g status-left ""

set -g window-status-separator ""
set -g window-status-format "#[fg=colour7] #I #W "
set -g window-status-current-format "#[fg=colour0,bg=colour4,bold] #I #W "

set -g status-right "#[fg=colour6] #{pane_current_command} #[fg=colour0,bg=colour5,bold] #S "

set -g message-style "bg=colour4,fg=colour0"
set -g message-command-style "bg=colour4,fg=colour0"
set -g mode-style "bg=colour4,fg=colour0"
set -g pane-active-border-style "fg=colour4"
set -g pane-border-style "fg=colour8"

## ── Plugins (TPM) ────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'hiroppy/tmux-agent-sidebar'

set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'

# Keep this line at the very bottom.
run '~/.config/tmux/plugins/tpm/tpm'
