# ~/.tmux.conf
#
# Converted from a NixOS home-manager `programs.tmux` module. Plugins are
# managed by TPM here instead of Nix, since there's no Nix store to source
# them from. One-time setup on a fresh machine:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# then press prefix + I inside tmux to have TPM install the plugins below.
#
# tmux-agent-sidebar (https://github.com/hiroppy/tmux-agent-sidebar) needs a
# one-time Claude Code setup after TPM installs it:
#   /plugin marketplace add ~/.tmux/plugins/tmux-agent-sidebar
#   /plugin install tmux-agent-sidebar@hiroppy

set -g clock-mode-style 24
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1

unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g default-terminal "tmux-256color"

set -g mode-key vi
set -as terminal-features ",xterm-256color:RGB"
bind s choose-tree -sZ -O name

# Status bar styled from the terminal's indexed palette (colour0-15) and the
# default fg/bg, so it follows whatever theme the terminal itself is using
# instead of being pinned to a hardcoded colorscheme.
set -g status-position bottom
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100

# Base bar blends with the terminal background.
set -g status-style "bg=default,fg=colour7"
set -g status-left ""

# Window list: inactive dimmed, current uses an accent block.
set -g window-status-separator ""
set -g window-status-format "#[fg=colour7] #I #W "
set -g window-status-current-format "#[fg=colour0,bg=colour4,bold] #I #W "

# Right side: current command, then the session name in an accent block.
set -g status-right "#[fg=colour6] #{pane_current_command} #[fg=colour0,bg=colour5,bold] #S "

# Match interactive elements to the palette too.
set -g message-style "bg=colour4,fg=colour0"
set -g message-command-style "bg=colour4,fg=colour0"
set -g mode-style "bg=colour4,fg=colour0"
set -g pane-active-border-style "fg=colour4"
set -g pane-border-style "fg=colour8"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'hiroppy/tmux-agent-sidebar'

set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'

# Keep this line at the very bottom of tmux.conf.
run '~/.tmux/plugins/tpm/tpm'
