## "Speakers (Boosted)" virtual sink for the ThinkPad T14 Gen 5 internal speakers.
##
## The ALC257 drives two small speakers with no smart amp or DSP, so even at
## 100% / 0 dB they're quiet. Windows makes up for that with Dolby loudness
## processing. This filter chain does the same job:
##   1. high-pass at 150 Hz: the speakers can't reproduce bass, so cutting it
##      frees up headroom for frequencies they can play
##   2. +12 dB gain into a lookahead limiter with a -1 dB ceiling, so the
##      output gets louder without clipping
##
## Requires: swh-plugins (fast_lookahead_limiter_1913 LADSPA plugin)
## Tune: change "Input gain (dB)" (0..20) below, then
##       systemctl --user restart pipewire

context.modules = [
  {
    name = libpipewire-module-filter-chain
    flags = [ nofail ]
    args = {
      node.description = "Speakers (Boosted)"
      media.name       = "Speakers (Boosted)"
      filter.graph = {
        nodes = [
          { type = builtin name = hpL label = bq_highpass control = { "Freq" = 150.0 "Q" = 0.707 } }
          { type = builtin name = hpR label = bq_highpass control = { "Freq" = 150.0 "Q" = 0.707 } }
          {
            type   = ladspa
            name   = limiter
            plugin = fast_lookahead_limiter_1913
            label  = fastLookaheadLimiter
            control = {
              "Input gain (dB)"  = 12.0
              "Limit (dB)"       = -1.0
              "Release time (s)" = 0.08
            }
          }
        ]
        links = [
          { output = "hpL:Out" input = "limiter:Input 1" }
          { output = "hpR:Out" input = "limiter:Input 2" }
        ]
        inputs  = [ "hpL:In" "hpR:In" ]
        outputs = [ "limiter:Output 1" "limiter:Output 2" ]
      }
      capture.props = {
        node.name      = "effect_input.speaker_boost"
        media.class    = Audio/Sink
        audio.channels = 2
        audio.position = [ FL FR ]
      }
      playback.props = {
        node.name      = "effect_output.speaker_boost"
        node.passive   = true
        audio.channels = 2
        audio.position = [ FL FR ]
        target.object  = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink"
        node.dont-fallback = true
        node.linger    = true
      }
    }
  }
]
