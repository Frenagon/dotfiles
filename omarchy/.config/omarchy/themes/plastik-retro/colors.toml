lighter_background = "#8E8780"

foreground = "#C8C4C1"
dark_foreground = "#A19B95"
light_foreground = "#E5E3E2"
bright_foreground = "#FFFFFF"

red = "#D96A62"
yellow = "#CCA056"
orange = "#D2855C"
green = "#78CCA1"
cyan = "#7AB8D0"
blue = "#7DA3FF"
magenta = "#AB86B0"
