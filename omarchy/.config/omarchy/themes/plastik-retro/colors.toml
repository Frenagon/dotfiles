# Plastik Retro — a mid-gray "retro plastic" variant, not from either of
# crimson's dark/light scheme files directly: same four accent hues as
# plastik-genesis/plastik-odyssey (ties the family together), built around a
# new warm mid-gray background/foreground ramp reminiscent of old beige/gray
# plastic computer cases, computed as blends toward black/white from a
# #6E655C base rather than pulled from a source palette.

